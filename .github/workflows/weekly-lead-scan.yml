name: Weekly Lead Scan

on:
  schedule:
    # Runs every Monday at 8:00 AM SGT (00:00 UTC)
    - cron: '0 0 * * 1'
  workflow_dispatch:  # Allow manual trigger

jobs:
  generate-leads:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: claude/relaxed-ride-EQrjs

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Generate 5 new leads
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          claude --print "Generate 5 new Singapore SME leads that are NOT already in data/candidates.csv or data/companies.csv. Follow the scan-leads skill in .claude/skills/scan-leads.md Mode B procedure. Add all 5 to candidates.csv as the next CAND### IDs (check current highest ID first). Use today's date for date_added. Set status=pending. Do not commit — just update the CSV." \
            --allowedTools "Read,Edit,Write,WebSearch,Bash"

      - name: Commit and push new leads
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/candidates.csv
          if git diff --cached --quiet; then
            echo "No new leads added, skipping commit."
          else
            git commit -m "chore: weekly lead scan - add 5 new candidates $(date +%Y-%m-%d)"
            git push origin claude/relaxed-ride-EQrjs
          fi
